<svg
  xmlns="http://www.w3.org/2000/svg"
  width="500"
  height="750"
  viewBox="0 0 500 750"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Aurora movie placeholder</title>
  <desc id="description">
    Placeholder artwork used when movie artwork is unavailable.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#111827" />
      <stop offset="55%" stop-color="#172554" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient
      id="glow"
      cx="50%"
      cy="40%"
      r="55%"
    >
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#background)" />
  <rect width="500" height="750" fill="url(#glow)" />

  <circle
    cx="250"
    cy="315"
    r="92"
    fill="none"
    stroke="#93c5fd"
    stroke-width="8"
    opacity="0.8"
  />

  <path
    d="M225 265 L310 315 L225 365 Z"
    fill="#ffffff"
    opacity="0.9"
  />

  <text
    x="250"
    y="470"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="48"
    font-weight="700"
    text-anchor="middle"
    letter-spacing="8"
  >
    AURORA
  </text>

  <text
    x="250"
    y="515"
    fill="#93c5fd"
    font-family="Arial, sans-serif"
    font-size="20"
    text-anchor="middle"
    letter-spacing="3"
  >
    ARTWORK UNAVAILABLE
  </text>
</svg>