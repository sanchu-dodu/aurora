name: Aurora CLI CI

on:
  push:
    paths:
      - "aurora-cli/**"
      - ".github/workflows/aurora-cli-ci.yml"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        node:
          - 22
          - 24

    defaults:
      run:
        working-directory: aurora-cli

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: aurora-cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release validation
        run: npm run release:check