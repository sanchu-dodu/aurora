name: Aurora CLI CI

on:
  push:
    paths:
      - "aurora-cli/**"
      - ".github/workflows/aurora-cli-ci.yml"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}

    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        node:
          - 22
          - 24

    defaults:
      run:
        working-directory: aurora-cli

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: aurora-cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release validation
        run: npm run release:check